<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EAT TASTY AND LOOK TASTY</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header>

<h1>EAT TASTY AND LOOK TASTY</h1>

<p>Created by Syeda Manahil</p>

</header>


<section class="hero">

<h2>Your Healthy Journey Starts Here ❤️</h2>

<p>
Choose Weight Gain or Weight Loss, search healthy recipes,
and generate your own personalized plan.
</p>

</section>


<div class="container">


<div class="card">

<h2>🔍 Recipe Search</h2>

<input
type="text"
id="searchBox"
placeholder="Search recipe..."
>

<button onclick="searchRecipe()">

Search

</button>

<div id="result"></div>

</div>



<div class="card">

<h2>📋 Personal Diet Planner</h2>

<input
type="text"
id="name"
placeholder="Your Name"
>

<input
type="number"
id="age"
placeholder="Age"
>

<input
type="number"
id="height"
placeholder="Height (cm)"
>

<input
type="number"
id="weight"
placeholder="Weight (kg)"
>

<select id="goal">

<option value="gain">
Weight Gain
</option>

<option value="loss">
Weight Loss
</option>

</select>

<button onclick="calculatePlan()">

Generate My Plan

</button>

<div id="planResult"></div>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
